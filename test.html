<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .stepper-vertical {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #ced4da;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      height: 40px;
    }

    /* 숫자 입력창 */
    .stepper-vertical input[type="number"] {
      width: 70px;
      border: none;
      padding: 0 10px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    /* 브라우저 기본 스피너 제거 */
    .stepper-vertical input[type="number"]::-webkit-outer-spin-button,
    .stepper-vertical input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* 상하 버튼 묶음 (세로 배치) */
    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      border-left: 1px solid #ced4da;
      width: 24px;
    }

    /* 개별 상/하 버튼 */
    .stepper-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: #f8f9fa;
      cursor: pointer;
      padding: 0;
      font-size: 9px;
      color: #495057;
      transition: background-color 0.15s;
    }

    .stepper-btn:hover {
      background: #e9ecef;
    }

    .stepper-btn:active {
      background: #dee2e6;
    }

    /* 위 버튼 아래에 얇은 구분선 */
    .stepper-btn.up {
      border-bottom: 1px solid #ced4da;
    }
  </style>
</head>
<body>

  <div class="stepper-vertical">
    <input type="number" id="quantity" value="1" min="0" max="100" step="1">
    <div class="btn-group-vertical">
      <button type="button" class="stepper-btn up" onclick="stepUp('quantity')">&#9650;</button>
      <button type="button" class="stepper-btn down" onclick="stepDown('quantity')">&#9660;</button>
    </div>
  </div>

  <script>
    function stepUp(id) {
      document.getElementById(id).stepUp();
    }

    function stepDown(id) {
      document.getElementById(id).stepDown();
    }
  </script>

</body>
</html>
