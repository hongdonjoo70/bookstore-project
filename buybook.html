<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buybook</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"    />
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/substyle.css">
</head>
<body>
    <section id="buyBook">
        <div class="buybookhead">
            <div class="booktitle"> </div>
            <div class="author"></div>
            <hr>
        </div>
        <div class="buybookbody">  
           <div class="bookimg">

           </div>
           <div class="bookInfo">
              <div class="buyInfo">
                <p>정가</p>
                <h4></h4>
              </div>
              <div class="buyInfo">
                <p>판매가</p>
                <h4></h4>
              </div>
              <hr>
              <div class="buyInfo">
                <p>카드최대혜택가</p>
                <h4></h4>
                <div></div>
              </div>
              <hr>
              <div class="buyInfo" id="downcoupon">
                <p>추가할인</p>
                <div>최대 3000원 할인쿠폰받기 <img src="img/btn_down.png"> </div>
              </div>
              <div class="buyInfo">
                <p>마일리지</p>
                <h4></h4>
              </div>
              <div class="buyInfo">
                <p>배송료</p>
                <h4>무료</h4>
              </div>
              <div class="buyInfo">
                <p>수령예상일</p>
                <div>
                  <span class="p_ytz_delivery">양탄자배송</span><br>
                  오후 1시까지 주문하면 밤 11시 
                  <span class="ytz_txt">잠들기전 배송</span>
                </div>
              </div>
              <div class="buyInfo">
              </div>              
              <div class="buyInfo">
              </div>              
              <div class="buyInfo">
                <p>수량</p>
                <div class="stepper-vertical">
                  <input type="number" id="quantity" value="1" min="0" max="100" step="1">
                  <div class="btn-group-vertical">
                    <button type="button" class="stepper-btn up" onclick="stepUp('quantity')">&#9650;</button>
                    <button type="button" class="stepper-btn down" onclick="stepDown('quantity')">&#9660;</button>
                  </div>
                </div>
              </div>              
           </div>
        </div>
    </section>
    <script src="./js/bookdetail.js"></script>
    <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = Number(params.get("id"));

    const detailContainer = document.getElementById("buyBook");

    // 2. ID에 해당하는 도서 데이터 검색
    const targetBook = bookdetailinfo[bookId];

    // 3. 화면 렌더링
    if (!targetBook) {
      detailContainer.innerHTML = `
        <div class="error-msg">
          <h2>도서 정보를 찾을 수 없습니다.</h2>
          <p style="margin-top: 8px;">올바른 경로로 접속했는지 확인해 주세요.</p>
        </div>
      `;
    } else {
      let booktitleBlocks = detailContainer.getElementsByClassName("booktitle");
      let authorBlocks = detailContainer.getElementsByClassName("author");
      let bookImg = detailContainer.querySelector(".bookimg");
      let bookInfos= detailContainer.querySelectorAll(".buyInfo");

      booktitleBlocks[0].innerHTML = targetBook.title;
      authorBlocks[0].innerHTML = targetBook.author;
      bookImg.innerHTML= `<img src=${targetBook.img}>`;
      //Update Book Information
      bookInfos[0].querySelector("h4").innerHTML =`
         <s>${bookdetailinfo[bookId].originalPrice.toLocaleString()}</s> 원`;
      bookInfos[1].querySelector("h4").innerHTML = `${bookdetailinfo[bookId].price.toLocaleString()} 원`;
      bookInfos[2].querySelector("h4").innerHTML = `${bookdetailinfo[bookId].promotePrice.toLocaleString()} 원<br>
      <h5>알라딘 만권당 삼성카드, 알라딘 15% 청구 할인   > &#x20DE</h5>
      <h6>최대 1만원 또는 2만원 할인(전월 30만원 또는 60만원 이용 시) / 카드 발급월 +1개월까지는 전월 실적이 없어도 최대 1만원 혜택 제공</h6>
      `;
      bookInfos[4].querySelector("h4").innerHTML = `${bookdetailinfo[bookId].price/100}원 + 멤버십(3-1%) <br> + 5만원이상 구매시 2000원 v &#x20DE`;
    }
    function stepUp(id) {
      document.getElementById(id).stepUp();
    }

    function stepDown(id) {
      document.getElementById(id).stepDown();
    }

  </script>
</body>
</html>
