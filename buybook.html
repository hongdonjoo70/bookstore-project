<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buybook</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"    />
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/substyle.css">
</head>
<body>
    <section id="buyBook">
        <div class="buybookhead">
            <div class="booktitle"> </div>
            <div class="author"></div>
        </div>
        <div class="buybookbody">  
           <div class="bookimg">

           </div>
           <div class="bookInfo">
              <div class="buyInfo">
                <p>판매가</p>
                <h4></h4>
              </div>
              <hr>
              <div class="buyInfo">
                <p>카드최대혜택가</p>
                <h4></h4>
                <div></div>
                
              </div>
              <hr>
              <div class="buyInfo">
                <p>마일리지</p>
                <h4></h4>
              </div>
              <div class="buyInfo">
                <p>배송료</p>
                <h4></h4>
              </div>
              <div class="buyInfo">
                <p>수령예상일</p>
                <h4></h4>
              </div>
              <div class="buyInfo">
              </div>              
              <div class="buyInfo">
              </div>              
              <div class="buyInfo">
                <p>수량</p>
                <select></select>

              </div>              

           </div>
        </div>
    </section>
    <script src="./js/bookdetail.js"></script>
    <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = Number(params.get("id"));

    const detailContainer = document.getElementById("buyBook");

    // 2. ID에 해당하는 도서 데이터 검색
    const targetBook = bookdetailinfo[bookId];

    // 3. 화면 렌더링
    if (!targetBook) {
      detailContainer.innerHTML = `
        <div class="error-msg">
          <h2>도서 정보를 찾을 수 없습니다.</h2>
          <p style="margin-top: 8px;">올바른 경로로 접속했는지 확인해 주세요.</p>
        </div>
      `;
    } else {
      let booktitleBlocks = detailContainer.getElementsByClassName("booktitle");
      let authorBlocks = detailContainer.getElementsByClassName("author");
      let bookImg = detailContainer.querySelector(".bookimg");
      let bookInfos= detailContainer.querySelectorAll(".buyInfo");

      booktitleBlocks[0].innerHTML = targetBook.title;
      authorBlocks[0].innerHTML = targetBook.author;
      bookImg.innerHTML= `<img src=${targetBook.img}>`;
      bookInfos[0].querySelector("h4").innerHTML = bookdetailinfo[bookId].price;
      bookInfos[1].querySelector("h4").innerHTML = bookdetailinfo[bookId].promotePrice;



    }
  </script>
</body>
</html>
